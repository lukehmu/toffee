<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toffee specimen</title>
<style>
  @font-face { font-family: Toffee; src: url("fonts/Toffee[SHDW,slnt,wght].woff2") format("woff2"); font-weight: 300 900; }
  @font-palette-values --orange { font-family: Toffee; base-palette: 1; }
  @font-palette-values --night  { font-family: Toffee; base-palette: 2; }
  @font-palette-values --candy  { font-family: Toffee; base-palette: 3; }
  :root { --wght: 900; --slnt: -10; --shdw: 600; --size: 160px; --bg: #e2482a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: #3c1c20; font: 15px/1.4 system-ui, sans-serif; }
  .controls { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center;
              padding: 12px 16px; background: rgba(60, 28, 32, .92); color: #f3ecd1; }
  .controls label { display: flex; gap: 8px; align-items: center; }
  .controls output { min-width: 3.5ch; font-variant-numeric: tabular-nums; }
  .stage { padding: 40px 16px 320px; overflow: hidden; }
  .tester { font-family: Toffee; font-size: var(--size); line-height: .95; outline: none; overflow-wrap: anywhere;
            font-variation-settings: "wght" var(--wght), "slnt" var(--slnt), "SHDW" var(--shdw); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; padding: 0 16px 60px; }
  .grid div { font-family: Toffee; font-size: 64px; text-align: center; padding: 8px 0;
              font-variation-settings: "wght" var(--wght), "slnt" var(--slnt), "SHDW" 0; }
</style>
<div class="controls">
  <label>Weight <input type="range" min="300" max="900" value="900" data-var="--wght"><output>900</output></label>
  <label>Slant <input type="range" min="-12" max="0" value="-10" data-var="--slnt"><output>-10</output></label>
  <label>Shadow <input type="range" min="0" max="1000" value="600" data-var="--shdw"><output>600</output></label>
  <label>Size <input type="range" min="24" max="320" value="160" data-var="--size" data-unit="px"><output>160</output></label>
  <label>Palette
    <select id="pal">
      <option value="normal" data-bg="#e2482a">Toffee</option>
      <option value="--orange" data-bg="#1f6fd1">Orange</option>
      <option value="--night" data-bg="#7d3cff">Night</option>
      <option value="--candy" data-bg="#ffd9e4">Candy</option>
    </select>
  </label>
</div>
<div class="stage"><div class="tester" contenteditable spellcheck="false">Best year yet</div></div>
<div class="grid" id="grid"></div>
<script>
  const root = document.documentElement;
  for (const input of document.querySelectorAll("input[data-var]")) {
    input.addEventListener("input", () => {
      root.style.setProperty(input.dataset.var, input.value + (input.dataset.unit || ""));
      input.nextElementSibling.value = input.value;
    });
  }
  const pal = document.getElementById("pal");
  pal.addEventListener("change", () => {
    document.querySelectorAll(".tester, .grid div").forEach(el => el.style.fontPalette = pal.value);
    root.style.setProperty("--bg", pal.selectedOptions[0].dataset.bg);
  });
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!?.,:;'\"()[]{}/\\|-–—+−=<>*#%$£€&@…“”‘’•·_~^";
  const grid = document.getElementById("grid");
  for (const c of chars) { const d = document.createElement("div"); d.textContent = c; grid.append(d); }
</script>
</html>
