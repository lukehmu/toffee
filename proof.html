<!doctype html>
<meta charset="utf-8">
<title>Toffee proof</title>
<style>
  @font-face { font-family: Toffee; src: url("fonts/Toffee[SHDW,slnt,wght].woff2") format("woff2"); font-weight: 300 900; }
  body { margin: 0; padding: 40px; background: #e2482a; font-family: Toffee; line-height: 1.05; }
  p { margin: 0 0 18px; white-space: nowrap; }
  .hero { font-size: 170px; line-height: .92; font-variation-settings: "wght" 900, "slnt" -10, "SHDW" 700; margin-bottom: 220px; }
  .set { font-size: 110px; font-variation-settings: "wght" 900, "slnt" 0, "SHDW" 0; }
  .punct { font-size: 80px; font-variation-settings: "wght" 900, "slnt" 0, "SHDW" 0; }
  .light { font-size: 110px; font-variation-settings: "wght" 300, "slnt" 0, "SHDW" 0; }
  .mid { font-size: 110px; font-variation-settings: "wght" 600, "slnt" -12, "SHDW" 250; }
</style>
<p class="hero">Best<br>year<br>yet</p>
